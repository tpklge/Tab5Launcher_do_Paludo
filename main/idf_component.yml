## Managed-component dependencies for tab5_launcher.
## ESP-IDF 5.4.4; dependency versions pinned below.
## Device C6 firmware is queried at runtime; this file does not update it.
dependencies:
  idf: ">=5.4.0"
  espressif/m5stack_tab5: "==1.3.2"
  espressif/esp_lvgl_port: "==2.9.0"
  lvgl/lvgl: "==9.3.0"
  # Wi-Fi through the ESP32-C6 on-board over SDIO.
  # C6 slave version varies between devices; do not assume a factory version.
  espressif/esp_hosted: "==2.13.1"
  espressif/esp_wifi_remote: "==1.6.5"
  # Optional USB-A Raspberry Pi CDC link, started only on explicit request.
  espressif/usb_host_cdc_acm: "==2.4.1"
  espressif/esp_tinyusb: "==3.0.0"
  espressif/usb_host_msc:
    version: "==1.3.0"
    override_path: "../components/espressif__usb_host_msc"
